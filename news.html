<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日新聞 · Matthew's Space</title>
<style>
:root{--bg:#0d1117;--panel:#161d27;--panel2:#202a37;--red:#c8102e;--text:#f4f6f8;--muted:#9aa8b7;--line:#2b3745}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px max(5vw,20px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;background:#0d1117ed;position:sticky;top:0}a{color:#f2a6b4}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{color:#f4f6f8;text-decoration:none;padding:8px 11px;border-radius:9px;background:#202a37}.brand{font-weight:850;letter-spacing:.08em}.mark{display:inline-grid;place-items:center;background:var(--red);width:34px;height:34px;border-radius:9px;margin-right:9px}main{max-width:1100px;margin:35px auto;padding:0 20px}.eyebrow{color:#e68a9b;font-size:11px;font-weight:800;letter-spacing:.15em}h1{font-size:clamp(30px,5vw,46px);margin:6px 0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;margin:18px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button,button{border:0;border-radius:9px;padding:9px 13px;background:var(--red);color:white;font-weight:700;cursor:pointer}.filters button.secondary{background:var(--panel2)}.story{padding:17px 0;border-top:1px solid var(--line)}.story:first-child{border:0}.story h3{margin:5px 0}.meta{font-size:12px;color:var(--muted)}.story a{font-weight:750;text-decoration:none}.story a:hover{text-decoration:underline}.status{font-size:12px;color:#e6a2af}.empty{color:var(--muted)}footer{text-align:center;color:#687686;padding:30px}
</style></head><body>
<header><div class="brand"><span class="mark">M</span>MATTHEW'S SPACE</div><nav><a href="personal-space.html">總覽</a><a href="news.html">每日新聞</a><a href="ideas.html">AI 想法整理</a></nav></header>
<main><div class="eyebrow">DAILY NEWSROOM</div><h1>每日新聞摘錄</h1><p>足球以外的世界新聞、科技、商業、國際及其他焦點。點擊標題即可前往新聞原文網站。</p>
<section class="panel"><div class="filters" id="filters"><button data-cat="全部">全部</button><button class="secondary" data-cat="國際">國際</button><button class="secondary" data-cat="科技">科技</button><button class="secondary" data-cat="商業">商業</button><button class="secondary" data-cat="足球">足球</button><button class="secondary" data-cat="其他">其他</button></div><p id="status" class="status">正在載入最新新聞…</p><div id="stories"></div></section>
<section class="panel"><b>新聞來源與更新</b><p>頁面開啟時會嘗試讀取公開 RSS 新聞摘要；新聞內容及版權屬原出版者。部分新聞網站可能限制第三方讀取，因此載入失敗時會顯示提示。新聞連結會在新分頁開啟原文。</p><button id="reload">重新整理新聞</button></section></main><footer>MATTHEW'S SPACE · NEWS</footer>
<script>
const feeds=[
{url:'https://news.google.com/rss/search?q=world+news&hl=zh-TW&gl=TW&ceid=TW:zh-Hant',fallback:'國際新聞'},
{url:'https://news.google.com/rss/search?q=technology&hl=en-US&gl=US&ceid=US:en',fallback:'科技新聞'},
{url:'https://news.google.com/rss/search?q=business&hl=en-US&gl=US&ceid=US:en',fallback:'商業新聞'},
{url:'https://news.google.com/rss/search?q=Liverpool+FC+football&hl=en-GB&gl=GB&ceid=GB:en',fallback:'利物浦及足球'}
];
let all=[],active='全部';
const el=id=>document.getElementById(id);
function category(title,source){const s=(title+' '+source).toLowerCase();if(/liverpool|premier league|football|soccer|利物浦|足球/.test(s))return'足球';if(/technology|tech|ai |artificial intelligence|科技|人工智能/.test(s))return'科技';if(/business|market|economy|finance|商業|經濟|財經/.test(s))return'商業';if(/world|international|外交|國際|政府|選舉/.test(s))return'國際';return'其他'}
function render(){const list=active==='全部'?all:all.filter(x=>x.cat===active);el('stories').innerHTML=list.length?list.map(x=>'<article class="story"><div class="meta">'+x.cat+' · '+esc(x.source)+'</div><h3><a href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a></h3><div class="meta">'+esc(x.date||'最新收錄')+' · <a href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer">閱讀原文 ↗</a></div></article>').join(''):'<p class="empty">目前沒有這個分類的新聞，或新聞來源暫時未能載入。</p>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){el('status').textContent='正在更新公開 RSS 新聞…';all=[];for(const f of feeds){try{const api='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f.url);const r=await fetch(api);if(!r.ok)throw Error('RSS');const j=await r.json();(j.items||[]).slice(0,8).forEach(i=>all.push({title:i.title,link:i.link,source:j.feed?.title||f.fallback,date:i.pubDate,cat:category(i.title,j.feed?.title||'')}))}catch(e){}}const seen=new Set();all=all.filter(x=>x.title&&x.link&&!seen.has(x.link)&&seen.add(x.link));el('status').textContent=all.length?'已載入 '+all.length+' 則新聞。來源更新時間以原網站為準。':'暫時無法自動讀取新聞來源。請稍後重試；你仍可使用其他新聞網站閱讀。';render()}
el('filters').addEventListener('click',e=>{if(e.target.dataset.cat){active=e.target.dataset.cat;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('secondary',b.dataset.cat!==active));render()}});el('reload').addEventListener('click',load);load();
</script></body></html>
